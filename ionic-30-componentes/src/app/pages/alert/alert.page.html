<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>ion-alert</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="fondo-oscuro">
  <div class="ficha">
    <div class="circulo-icono">
      <ion-icon name="alert-circle-outline"></ion-icon>
    </div>
    <h1>Alerta</h1>
    <p class="etiqueta-tag">ion-alert</p>

    <ion-text class="descripcion">
      <p>Muestra un mensaje emergente importante que requiere la atención o confirmación del usuario.</p>
    </ion-text>

    <div class="separador">
      <span>VISTA PREVIA</span>
    </div>

    <div class="panel-demo">
      <ion-button id="abrir-alert">Mostrar alerta</ion-button>
    <ion-alert trigger="abrir-alert" header="Atención" message="Este es un mensaje de alerta de ejemplo." [buttons]="['OK']"></ion-alert>
    </div>
  </div>
</ion-content>
