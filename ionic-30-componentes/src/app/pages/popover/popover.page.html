<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>ion-popover</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="fondo-oscuro">
  <div class="ficha">
    <div class="circulo-icono">
      <ion-icon name="chatbox-outline"></ion-icon>
    </div>
    <h1>Popover</h1>
    <p class="etiqueta-tag">ion-popover</p>

    <ion-text class="descripcion">
      <p>Muestra un pequeño panel flotante cerca de un elemento, útil para menús contextuales u opciones rápidas.</p>
    </ion-text>

    <div class="separador">
      <span>VISTA PREVIA</span>
    </div>

    <div class="panel-demo">
      <ion-button id="abrir-popover">Abrir popover</ion-button>
    <ion-popover trigger="abrir-popover" triggerAction="click">
      <ng-template>
        <ion-content class="ion-padding">Contenido del popover.</ion-content>
      </ng-template>
    </ion-popover>
    </div>
  </div>
</ion-content>
