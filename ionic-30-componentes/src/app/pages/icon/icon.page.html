<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>ion-icon</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="fondo-oscuro">
  <div class="ficha">
    <div class="circulo-icono">
      <ion-icon name="happy-outline"></ion-icon>
    </div>
    <h1>Icono</h1>
    <p class="etiqueta-tag">ion-icon</p>

    <ion-text class="descripcion">
      <p>Muestra símbolos gráficos que ayudan a comunicar acciones o significados de forma visual y rápida.</p>
    </ion-text>

    <div class="separador">
      <span>VISTA PREVIA</span>
    </div>

    <div class="panel-demo">
      <ion-icon name="heart-outline" style="font-size: 32px;" color="warning"></ion-icon>
    <ion-icon name="star-outline" style="font-size: 32px;" color="warning"></ion-icon>
    <ion-icon name="thumbs-up-outline" style="font-size: 32px;" color="warning"></ion-icon>
    </div>
  </div>
</ion-content>
