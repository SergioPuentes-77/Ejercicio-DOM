<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>ion-badge</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="fondo-oscuro">
  <div class="ficha">
    <div class="circulo-icono">
      <ion-icon name="pricetag-outline"></ion-icon>
    </div>
    <h1>Insignia</h1>
    <p class="etiqueta-tag">ion-badge</p>

    <ion-text class="descripcion">
      <p>Muestra una pequeña etiqueta con un número o texto corto, como notificaciones sin leer.</p>
    </ion-text>

    <div class="separador">
      <span>VISTA PREVIA</span>
    </div>

    <div class="panel-demo">
      <ion-badge color="warning">Nuevo</ion-badge>
    </div>
  </div>
</ion-content>
