<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>ion-avatar</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="fondo-oscuro">
  <div class="ficha">
    <div class="circulo-icono">
      <ion-icon name="person-circle-outline"></ion-icon>
    </div>
    <h1>Avatar</h1>
    <p class="etiqueta-tag">ion-avatar</p>

    <ion-text class="descripcion">
      <p>Muestra una imagen o icono circular que representa a un usuario, como una foto de perfil.</p>
    </ion-text>

    <div class="separador">
      <span>VISTA PREVIA</span>
    </div>

    <div class="panel-demo">
      <ion-avatar>
      <ion-icon name="person-outline"></ion-icon>
    </ion-avatar>
    </div>
  </div>
</ion-content>
