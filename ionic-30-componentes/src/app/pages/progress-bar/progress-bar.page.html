<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>ion-progress-bar</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="fondo-oscuro">
  <div class="ficha">
    <div class="circulo-icono">
      <ion-icon name="hourglass-outline"></ion-icon>
    </div>
    <h1>Barra de progreso</h1>
    <p class="etiqueta-tag">ion-progress-bar</p>

    <ion-text class="descripcion">
      <p>Muestra visualmente el avance de una tarea o proceso, como la carga de un archivo.</p>
    </ion-text>

    <div class="separador">
      <span>VISTA PREVIA</span>
    </div>

    <div class="panel-demo">
      <ion-progress-bar value="0.5" color="warning"></ion-progress-bar>
    </div>
  </div>
</ion-content>
