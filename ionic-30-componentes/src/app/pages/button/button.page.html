<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>ion-button</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="fondo-oscuro">
  <div class="ficha">
    <div class="circulo-icono">
      <ion-icon name="radio-button-on-outline"></ion-icon>
    </div>
    <h1>Botón</h1>
    <p class="etiqueta-tag">ion-button</p>

    <ion-text class="descripcion">
      <p>Se usa para ejecutar una acción cuando el usuario lo presiona, como enviar un formulario, confirmar una compra o navegar a otra pantalla.</p>
    </ion-text>

    <div class="separador">
      <span>VISTA PREVIA</span>
    </div>

    <div class="panel-demo">
      <ion-button>Botón de ejemplo</ion-button>
    </div>
  </div>
</ion-content>
