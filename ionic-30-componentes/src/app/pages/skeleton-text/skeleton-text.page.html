<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>ion-skeleton-text</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="fondo-oscuro">
  <div class="ficha">
    <div class="circulo-icono">
      <ion-icon name="layers-outline"></ion-icon>
    </div>
    <h1>Texto esqueleto</h1>
    <p class="etiqueta-tag">ion-skeleton-text</p>

    <ion-text class="descripcion">
      <p>Muestra una silueta animada del contenido mientras este se está cargando, mejorando la experiencia de espera.</p>
    </ion-text>

    <div class="separador">
      <span>VISTA PREVIA</span>
    </div>

    <div class="panel-demo">
      <ion-item>
      <ion-label>
        <h3><ion-skeleton-text [animated]="true" style="width: 60%;"></ion-skeleton-text></h3>
        <p><ion-skeleton-text [animated]="true" style="width: 80%;"></ion-skeleton-text></p>
      </ion-label>
    </ion-item>
    </div>
  </div>
</ion-content>
