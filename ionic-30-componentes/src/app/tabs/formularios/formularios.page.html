<ion-header>
  <ion-toolbar>
    <ion-title>Formularios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h3>9. ion-input</h3>
  <ion-item>
    <ion-label position="floating">Nombre</ion-label>
    <ion-input></ion-input>
  </ion-item>

  <h3>10. ion-textarea</h3>
  <ion-item>
    <ion-label position="floating">Comentario</ion-label>
    <ion-textarea></ion-textarea>
  </ion-item>

  <h3>11. ion-checkbox</h3>
  <ion-item>
    <ion-checkbox slot="start"></ion-checkbox>
    <ion-label>Aceptar términos</ion-label>
  </ion-item>

  <h3>12. ion-radio</h3>
  <ion-radio-group>
    <ion-item><ion-label>Opción A</ion-label><ion-radio slot="start" value="a"></ion-radio></ion-item>
    <ion-item><ion-label>Opción B</ion-label><ion-radio slot="start" value="b"></ion-radio></ion-item>
  </ion-radio-group>

  <h3>13. ion-toggle</h3>
  <ion-item>
    <ion-label>Notificaciones</ion-label>
    <ion-toggle slot="end"></ion-toggle>
  </ion-item>

  <h3>14. ion-select</h3>
  <ion-item>
    <ion-label>País</ion-label>
    <ion-select>
      <ion-select-option value="co">Colombia</ion-select-option>
      <ion-select-option value="mx">México</ion-select-option>
    </ion-select>
  </ion-item>

  <h3>15. ion-range</h3>
  <ion-item>
    <ion-label>Volumen</ion-label>
    <ion-range min="0" max="100"></ion-range>
  </ion-item>

  <h3>16. ion-datetime</h3>
  <ion-datetime presentation="date"></ion-datetime>
</ion-content>
