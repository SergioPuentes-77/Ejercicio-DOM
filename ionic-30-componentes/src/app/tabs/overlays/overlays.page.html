<ion-header>
  <ion-toolbar>
    <ion-title>Overlays</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h3>26. ion-alert</h3>
  <ion-button expand="block" (click)="mostrarAlerta()">Mostrar Alerta</ion-button>

  <h3>27. ion-toast</h3>
  <ion-button expand="block" (click)="mostrarToast()">Mostrar Toast</ion-button>

  <h3>28. ion-loading</h3>
  <ion-button expand="block" (click)="mostrarCarga()">Mostrar Carga</ion-button>

  <h3>29. ion-action-sheet</h3>
  <ion-button expand="block" (click)="mostrarOpciones()">Mostrar Opciones</ion-button>

  <h3>30. ion-modal</h3>
  <ion-button expand="block" (click)="abrirModal()">Abrir Modal</ion-button>
</ion-content>
