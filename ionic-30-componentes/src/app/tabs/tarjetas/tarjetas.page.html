<ion-header>
  <ion-toolbar>
    <ion-title>Tarjetas y Listas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h3>4. ion-card</h3>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Título</ion-card-title>
    </ion-card-header>
    <ion-card-content>Contenido de la tarjeta.</ion-card-content>
  </ion-card>

  <h3>5. ion-list + ion-item</h3>
  <ion-list>
    <ion-item><ion-label>Elemento 1</ion-label></ion-item>
    <ion-item><ion-label>Elemento 2</ion-label></ion-item>
  </ion-list>

  <h3>6. ion-item-sliding</h3>
  <ion-list>
    <ion-item-sliding>
      <ion-item><ion-label>Desliza este item</ion-label></ion-item>
      <ion-item-options side="end">
        <ion-item-option color="danger">Borrar</ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

  <h3>7. ion-avatar</h3>
  <ion-avatar><img src="https://i.pravatar.cc/100"></ion-avatar>

  <h3>8. ion-thumbnail</h3>
  <ion-thumbnail><img src="https://i.pravatar.cc/100"></ion-thumbnail>
</ion-content>
