<ion-header>
  <ion-toolbar>
    <ion-title>Botones e Íconos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h3>1. ion-button</h3>
  <ion-button expand="block">Botón normal</ion-button>
  <ion-button expand="block" fill="outline">Outline</ion-button>
  <ion-button expand="block" color="danger">Peligro</ion-button>

  <h3>2. ion-icon</h3>
  <ion-icon name="heart" size="large" color="danger"></ion-icon>

  <h3>3. ion-fab</h3>
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button>
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
