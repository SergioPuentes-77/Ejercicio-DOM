<div class="calculadora">
  <h2>Calculadora</h2>

  <label>Num1</label>
  <input type="number" [(ngModel)]="num1" placeholder="Ingrese el primer número">

  <label>Op.</label>
  <select [(ngModel)]="operador">
    <option value="+">+</option>
    <option value="-">-</option>
    <option value="/">/</option>
    <option value="*">*</option>
    <option value="^">^</option>
  </select>

  <label>Num2</label>
  <input type="number" [(ngModel)]="num2" placeholder="Ingrese el segundo número">

  <button (click)="operar()">Operar</button>

  <div class="resultado">
    Resultado = {{ resultado }}
  </div>

  <div class="historial" *ngIf="historial.length > 0">
    <h3>Historial</h3>
    <ul>
      <li *ngFor="let item of historial">{{ item }}</li>
    </ul>
  </div>
</div>
