<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio: Manipulación del DOM</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    max-width: 700px;
    margin: 40px auto;
    padding: 0 20px;
    background: #f4f6f8;
    color: #222;
  }
  h1 { color: #2c3e50; }
  .instrucciones {
    background: #fff;
    border-left: 4px solid #3498db;
    padding: 16px 20px;
    border-radius: 6px;
    margin-bottom: 24px;
  }
  .instrucciones h2 { margin-top: 0; font-size: 18px; }
  .instrucciones ol { padding-left: 20px; }
  .instrucciones code {
    background: #eef2f5;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
  #app {
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  #form-tarea { display: flex; gap: 8px; margin-bottom: 16px; }
  #input-tarea {
    flex: 1;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
  }
  #btn-agregar {
    padding: 10px 16px;
    background: #3498db;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  #btn-agregar:hover { background: #2980b9; }
  #lista-tareas { list-style: none; padding: 0; margin: 0; }
  #lista-tareas li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid #eee;
  }
  #lista-tareas li.completada span { text-decoration: line-through; color: #999; }
  .btn-eliminar {
    background: #e74c3c;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 12px;
  }
  .btn-eliminar:hover { background: #c0392b; }
  #contador { margin-top: 12px; font-size: 13px; color: #666; }
</style>
</head>
<body>

<h1>Ejercicio: Lista de tareas con DOM</h1>

<div class="instrucciones">
  <h2>Instrucciones</h2>
  <p>Escriba una tarea</p>
</div>

<div id="app">
  <form id="form-tarea">
    <input type="text" id="input-tarea" placeholder="Escribe una nueva tarea..." required>
    <button type="submit" id="btn-agregar">Agregar</button>
  </form>
  <ul id="lista-tareas"></ul>
  <p id="contador">0 tareas pendientes</p>
</div>

<script>
  const formulario = document.getElementById('form-tarea');
  const input = document.getElementById('input-tarea');
  const lista = document.getElementById('lista-tareas');
  const contador = document.getElementById('contador');

  formulario.addEventListener('submit', function (event) {
    event.preventDefault();
    agregarTarea(input.value);
  });

  function agregarTarea(texto) {
    const li = document.createElement('li');
    const span = document.createElement('span');
    const btnEliminar = document.createElement('button');

    span.textContent = texto;
    btnEliminar.textContent = 'Eliminar';
    btnEliminar.classList.add('btn-eliminar');

    li.appendChild(span);
    li.appendChild(btnEliminar);
    lista.appendChild(li);

    span.addEventListener('click', function () {
      li.classList.toggle('completada');
      actualizarContador();
    });

    btnEliminar.addEventListener('click', function () {
      li.remove();
      actualizarContador();
    });

    input.value = '';
    actualizarContador();
  }

  function actualizarContador() {
    const pendientes = lista.querySelectorAll('li:not(.completada)').length;
    contador.textContent = `${pendientes} tareas pendientes`;
  }
</script>

</body>
</html>
